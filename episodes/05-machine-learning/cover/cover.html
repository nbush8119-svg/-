<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Noto Sans CJK SC";font-weight:500;src:url(../kit/fonts/NotoSansCJKsc-Medium.otf)}
@font-face{font-family:"Noto Sans CJK SC";font-weight:700;src:url(../kit/fonts/NotoSansCJKsc-Bold.otf)}
@font-face{font-family:"Noto Sans CJK SC";font-weight:900;src:url(../kit/fonts/NotoSansCJKsc-Black.otf)}
@font-face{font-family:"Noto Serif CJK SC";font-weight:100 900;src:url(../kit/fonts/NotoSerifCJKsc-Black.otf)}
.blk{display:inline-block;border:4px solid var(--ink);border-radius:14px;padding:4px 26px;margin-right:18px;font:900 64px "Noto Serif CJK SC";background:#161A20}
.blk.g{border-color:var(--gold);color:var(--gold)}
.id{display:inline-block;text-align:center;font:900 46px "Noto Sans CJK SC";color:var(--gold)}
:root{--bg:#0E1014;--ink:#ECE5D8;--gold:#CDAA6B;--mute:#857F74;--soft:#2B3039}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
.page{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:"Noto Sans CJK SC";
 background:radial-gradient(900px 900px at 50% 42%,#1d2129 0%,#12151a 55%,#0b0d10 100%)}
.grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay}
.serif{font-family:"Noto Serif CJK SC";font-weight:700}
.gold{color:var(--gold)}
.badge{position:absolute;left:80px;top:250px;display:flex;align-items:center;gap:18px;font:700 34px "Noto Sans CJK SC";color:var(--mute);letter-spacing:4px}
.badge b{color:var(--bg);background:var(--gold);padding:6px 16px;border-radius:8px;letter-spacing:2px}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div class="page">
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
 <div class="badge"><b>No.03</b>费曼学习法卡片 · B7.1</div>
 <div style="position:absolute;left:70px;right:70px;top:380px;height:1180px;background:linear-gradient(180deg,#1a1e25,#14171c);border:2px solid #2B3039;border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.6)"></div>
 <div style="position:absolute;left:70px;right:70px;top:380px;height:10px;background:var(--gold);border-radius:28px 28px 0 0"></div>
 <div style="position:absolute;left:140px;top:460px;font:700 34px 'Noto Sans CJK SC';color:var(--mute);letter-spacing:6px">一句话讲明白</div>
 <div class="serif" style="position:absolute;left:126px;top:530px;font-size:200px;line-height:1.1;font-weight:900">Token<span class="gold" style="font-size:72px;margin-left:20px">词元</span></div>
 <div class="serif" style="position:absolute;left:140px;top:810px;font-size:96px;line-height:1.25">就是 AI 眼里的<br><span class="gold" style="border-bottom:8px solid var(--gold)">一个字</span></div>
 <div style="position:absolute;left:140px;right:140px;top:1110px;height:2px;background:#2B3039"></div>
 <div style="position:absolute;left:140px;top:1150px;font:500 34px 'Noto Sans CJK SC';color:var(--mute);letter-spacing:4px">AI 读「我爱吃火锅」：</div>
 <div style="position:absolute;left:140px;top:1220px"><span class="blk">我</span><span class="blk g">爱吃</span><span class="blk">火锅</span></div>
 <div style="position:absolute;left:140px;top:1370px;font:500 34px 'Noto Sans CJK SC';color:var(--mute)">它看到的其实是：<span class="id">2769 · 15931 · 8848</span></div>
 <div style="position:absolute;left:0;right:0;top:1610px;text-align:center;font:700 40px 'Noto Sans CJK SC';color:var(--ink);letter-spacing:2px">AI 是<span class="gold">按字</span>收费的吗？</div>
</div></body></html>
